  # NOT an independent reference. triton-lifter's gear body comes from
  # py_gearworks, while triton-lifter.scad's comes from gears.scad; the two
  # generators disagree on tooth profile by about 46% of volume, so the
  # OpenSCAD render cannot decide this part. These numbers are the current
  # build123d output, recorded as a ratchet: they catch a regression, they do
  # not establish correctness. The boss and the two bores — the parts this
  # port actually got wrong — do match the original, and show up here as the
  # z minimum of -2.7.
  triton-lifter:
    source: build123d
    volume: 9246.070
    bbox: [[-16.374, -16.374, -2.700], [51.375, 16.374, 9.686]]
