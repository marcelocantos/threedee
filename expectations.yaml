# Expected geometry for every part `make` exports, checked by
# tools/check_geometry.py.
#
# Unless noted otherwise, `volume` and `bbox` are measured from
# `openscad -o ref.stl <part>.scad` — the original the build123d script was
# ported from. They are therefore independent of the output they gate: a
# regression in a project script cannot quietly move the expectation with it.
# Regenerate a value only when the .scad itself changes.
#
# The residual gap between the two renderers is OpenSCAD's faceting: its
# cylinders and spheres are polygons ($fn=12 to $fn=240 across these files),
# build123d's are exact. That accounts for the tolerances below — 0.694% of
# volume on led-stumps is the worst case, and 0.034 mm of bounding box on
# rotary-bearing.

tolerance:
  volume_fraction: 0.01
  bbox_mm: 0.05

parts:
  baby-gate-latch:
    source: openscad
    volume: 13279.422
    bbox: [[0.000, 0.000, 0.000], [113.500, 100.000, 10.000]]

  bosch-adapter:
    source: openscad
    volume: 15977.058
    bbox: [[-23.980, -23.980, 0.000], [23.980, 23.980, 24.800]]

  catflap-rpi:
    source: openscad
    volume: 53745.899
    bbox: [[-26.386, -0.386, -0.386], [90.486, 61.886, 30.386]]

