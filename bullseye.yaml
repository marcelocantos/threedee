    name: '`make` builds all twelve parts to export/ with exit 0'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '`make clean && make` exits 0 on burst/build-fix; export/ holds 24 non-empty files (12 .stl + 12 .step). bosch-adapter.stl vs an OpenSCAD render of bosch-adapter.scad: volume 15968.18 vs 15977.06 mm3 (0.06%, OpenSCAD faceting + its 0.001 epsilons), identical bbox, centroid agreeing to 1e-3, and ray-cast angular occupancy at four z/r probes agreeing on 179-180 of 180 azimuths (disagreements only at exact tangent angles 0/90/270).'
