    context: 'Entropy-audit ENT-003 (P1). Status: observed fact. OpenSCAD `cylinder(h=)` is min-aligned; build123d `Cylinder` is centered. Copying SCAD numeric `z=50` without copying alignment disconnects a feature that must sit on the wall. Remediation: `align=Align.MIN` on tube, cavity, and barrier cylinders/cones (or `Pos(0,0,length/2)` with documented centering). Blast: magnet-tube only as written; any future port of a non-centered SCAD cylinder. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
