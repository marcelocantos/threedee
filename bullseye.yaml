  T1.6:
    name: '`Pos * Shape` inside `BuildPart` drops the location — rails, ribs, and holes collapse'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - bbox/volume golden tests vs current OpenSCAD (or vs measured hardware)
    - Starlock z-span must not be 41.7 from a centered origin tab; screw-box z-span must be ~1.4 not 49; router lattice volume must be lattice-scale, not 9e3
    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P1). Status: observed fact (live constructors + volume/bbox). in builder context, `Shape()` registers an unlocated solid; the `Location * Shape` result is discarded unless passed to `add()`. Every loop iteration stacks another copy at the origin. The part still “builds”, so `make` is green. Remediation: rewrite those three in algebra-only (as `CLAUDE.md` already requires), or wrap every located solid in `add(..., mode=...)`. Do not “fix” with more builder sugar. Blast: starlock holders, screw-box partitions, router-bit rack — three of twelve parts, all mechanical fixtures. Pattern can recur in any new `BuildPart` port. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-002
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
