  T4:
    name: '`make` builds all twelve parts to export/ with exit 0'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '`make clean && make` exits 0 on burst/build-fix; export/ holds 24 non-empty files (12 .stl + 12 .step). bosch-adapter.stl vs an OpenSCAD render of bosch-adapter.scad: volume 15968.18 vs 15977.06 mm3 (0.06%, OpenSCAD faceting + its 0.001 epsilons), identical bbox, centroid agreeing to 1e-3, and ray-cast angular occupancy at four z/r probes agreeing on 179-180 of 180 azimuths (disagreements only at exact tangent angles 0/90/270).'
    acceptance:
    - '`make clean && make` exits 0 against the installed build123d'
    - export/ contains a non-empty .stl and .step for each of the twelve projects/*.py
    - bosch-adapter geometry matches the OpenSCAD original (volume, bbox, angular occupancy)
    context: 'projects/bosch_adapter.py raised `ValueError: Cannot move an empty shape` under build123d 0.10.1.dev310+ge8cae0660: bare `Align.MIN` on Cone/Cylinder shifts them into the +x/+y quadrant, so the slot masks (centred on the z axis) intersected nothing.'
    origin: manual
    discovered: 2026-09-06
    achieved: 2026-09-06
  T5:
    name: Every ported part's geometry matches an OpenSCAD render of its .scad original
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '3b47c10, f538921, aa6d006. Eleven of twelve parts now agree with an `openscad -o ref.stl <part>.scad` render on bounding box (within 0.034 mm) and volume (within 0.694%, all of it faceting), with volume centroids agreeing to 0.07 mm or better. Nine parts were wrong before: catflap-rpi 262.7% of volume and 83.7 mm of bbox out; router-bit-rack''s whole lattice collapsed onto the origin; starlock-holders 32.8%; screw-box-partitions 32.0%; magnet-tube 89.9%; nailgun-tip 9.0%; baby-gate-latch, machinist-square-mount and triton-lifter with misplaced bores and bosses. led-stumps, rotary-bearing and bosch-adapter were already correct. RESIDUE: triton-lifter''s gear body cannot be decided by the oracle — it comes from py_gearworks, not gears.scad, and the two generators differ by ~46% of volume; only its boss and bores were checked (both now match, z minimum -2.7 as in the original). No part was verified against a physical print.'
    acceptance:
    - For each projects/*.py with a matching .scad, the exported STL agrees with an `openscad -o ref.stl part.scad` render on volume (within faceting tolerance), bounding box and volume centroid.
    - Parts with no .scad reference are listed explicitly as unverifiable.
    context: Align.MIN in build123d aligns all three axes, and Box/Cylinder/Cone default to CENTER on all three, where OpenSCAD's cube() is min-aligned and cylinder()/cone() are centred in x/y and min in z. Several ports also used builder-mode `Pos(...) * Shape(...)`, where the Shape auto-adds unmoved and the moved copy is discarded. These built without error and were never checked.
    origin: manual
    discovered: 2026-09-07
    achieved: 2026-09-07
  T6:
    name: '`make` fails when a part exports empty, degenerate or misplaced geometry'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'aa6d006. `make` now ends with tools/check_geometry.py against expectations.yaml (measured from the OpenSCAD renders, not from the build123d output). GREEN: `make clean && make` exits 0, "Geometry check passed: 12 parts.". RED (misplaced): reverting magnet_tube to bare Align.MIN gives "magnet-tube: bounding box [0,0.001,0]..[23.999,23.999,65], expected [-11.995,-11.995,0]..[11.995,11.995,65] (12.004 mm out, limit 0.05 mm)" and `make: *** [check] Error 1`. RED (empty/missing): a zero-triangle STL and a deleted one give "0 triangles — the mesh is empty or degenerate" and "was not exported", exit 1.'
    acceptance:
    - '`make` runs a geometry check on every exported STL as part of the default target, not an optional side target.'
    - Breaking one part's geometry makes `make` exit non-zero (demonstrated RED then GREEN).
    - Per-part expected bounding box and volume live in a checked-in expectations file, not in the Makefile.
    context: Nothing checked the exported meshes; nine parts shipped misplaced solids for as long as they have existed because a clean exit was the only gate.
    origin: manual
    discovered: 2026-09-07
    achieved: 2026-09-07
